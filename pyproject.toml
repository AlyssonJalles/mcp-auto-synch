[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sync-tray"
version = "0.0.1"
description = "Minimal menu bar / system tray app that keeps MCP server configuration in sync across AI coding tools (Codex, Claude Code, Cursor, VS Code, Gemini CLI, Copilot CLI, Windsurf, Zed, OpenCode, Continue, Antigravity, Claude Desktop)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "watchdog>=4.0.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "PyYAML>=6.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "setproctitle>=1.3.0",
]

[project.optional-dependencies]
windows-notifications = ["win10toast>=0.9"]

[project.scripts]
mcp-sync = "mcp_sync.app:main"

[tool.setuptools.packages.find]
include = ["mcp_sync*"]

[tool.setuptools.package-data]
mcp_sync = ["assets/logos/*.png", "assets/logos/*.jpg", "assets/logos/*.jpeg"]
